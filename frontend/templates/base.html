<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>EcoVolt</span>
        </div>
        <nav>
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="/paneles" class="{% if request.url.path == '/paneles' %}active{% endif %}">
                <i class="fas fa-solar-panel"></i> Paneles
            </a>
            <a href="/baterias" class="{% if request.url.path == '/baterias' %}active{% endif %}">
                <i class="fas fa-battery-three-quarters"></i> Baterías
            </a>
            <a href="/consumo" class="{% if request.url.path == '/consumo' %}active{% endif %}">
                <i class="fas fa-plug"></i> Consumo
            </a>
            <a href="/alertas" class="{% if request.url.path == '/alertas' %}active{% endif %}">
                <i class="fas fa-exclamation-triangle"></i> Alertas
            </a>
        </nav>
    </div>

    <main class="content">
        <header>
            <div class="header-title">
                <h1>{{ title.split(' - ')[0] }}</h1>
                <p id="current-time"></p>
            </div>
            <div class="user-profile">
                <span class="status-indicator online"></span>
                <span>Sistema Online</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=4CAF50&color=fff" alt="User">
            </div>
        </header>

        <section class="main-container">
            {% block content %}{% endblock %}
        </section>
    </main>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
    <script>
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const timeElem = document.getElementById('current-time');
            if (timeElem) timeElem.innerText = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
